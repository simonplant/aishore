# aishore configuration

project:
  name: "aishore"

# Working core verification — a synthetic transaction that proves the primary
# end-to-end path works. The product doing its primary thing for real.
# Runs before every pick (gates feature-track items) and after every merge.
# The architect agent can propose this from the core definition in PRODUCT.md.
# core:
#   command: ""
#   timeout: 120

# Setup command runs in each worktree before the sprint starts.
# Use this to install dependencies that aren't in git (node_modules, venv, etc.)
# setup:
#   command: "npm install"

# Backlog files to read from (relative to backlog/ directory).
# Omit to use the default: [backlog.json, bugs.json]
# backlog_files:
#   - backlog.json
#   - bugs.json
#   - infra.json

# models:
