name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: shellcheck -S warning .aishore/aishore install.sh scripts/*.sh

  test:
    name: Basic Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Check script is executable
        run: test -x .aishore/aishore

      - name: Syntax check
        run: bash -n install.sh && bash -n scripts/check-drift.sh

      - name: Test metrics command
        run: .aishore/aishore metrics

  macos:
    name: macOS Compatibility
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install jq coreutils

      - name: Test help command
        run: .aishore/aishore help

      - name: Test version command
        run: .aishore/aishore version

      - name: Test metrics command
        run: .aishore/aishore metrics
