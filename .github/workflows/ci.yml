name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  selftest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: pip install pytest ruff
      - run: ruff check aishore
      - run: shellcheck install.sh aishore/scaffold/aishore.sh
        if: runner.os == 'Linux'
      - run: bin/aishore selftest
